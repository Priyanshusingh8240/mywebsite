<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('/placeholder.svg?height=1080&width=1920');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    .chat-container {
      background: rgba(255, 255, 255, 0.95);
      width: 400px;
      height: 600px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      backdrop-filter: blur(5px);
    }

    .chat-header {
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      color: white;
      padding: 15px 20px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2em;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #f5f7fb;
    }

    .message {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 80%;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      background: linear-gradient(135deg, #00b09b, #96c93d);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
      margin-left: auto;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .bot {
      background: white;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
      margin-right: auto;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .input-box {
      display: flex;
      border-top: 1px solid #eee;
      background: white;
      padding: 10px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border: none;
      border-radius: 30px;
      font-size: 1em;
      background: #f0f2f5;
      outline: none;
      transition: all 0.3s;
    }

    input:focus {
      background: #e6e9ed;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    button {
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    button:active {
      transform: translateY(0);
    }

    .typing-indicator {
      display: flex;
      padding: 12px 16px;
      background: white;
      border-radius: 18px;
      align-self: flex-start;
      margin-bottom: 10px;
      width: fit-content;
    }

    .typing-indicator span {
      height: 8px;
      width: 8px;
      background: #bbb;
      border-radius: 50%;
      display: inline-block;
      margin: 0 2px;
      animation: bounce 1.3s linear infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      AI Assistant
    </div>
    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Hello! I'm your AI assistant. How can I help you today?
      </div>
    </div>
    <div class="input-box">
      <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatBox = document.getElementById("chatBox");
    
    // Add event listeners
    userInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
    
    sendBtn.addEventListener("click", sendMessage);

    // Initial greeting
    setTimeout(() => {
      addMessage("bot", "Feel free to ask me anything!");
    }, 1000);

    function sendMessage() {
      const message = userInput.value.trim();
      if (message === "") return;

      addMessage("user", message);
      userInput.value = "";
      
      // Simulate response time
      setTimeout(() => {
        const reply = getBotReply(message);
        addMessage("bot", reply);
      }, 500);
    }

    function addMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${sender}`;
      msgDiv.textContent = text;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getBotReply(msg) {
      const text = msg.toLowerCase();
      
      // Greetings
      if (text.includes("hello") || text.includes("hi") || text.includes("hey")) 
        return "Hello there! How can I assist you today?";
      
      // Personal questions
      if (text.includes("how are you")) 
        return "I'm doing great, thanks for asking! How about you?";
      
      if (text.includes("your name") || text.includes("who are you")) 
        return "I'm an AI assistant designed to help answer your questions!";
      
      // Farewells
      if (text.includes("bye") || text.includes("goodbye") || text.includes("see you")) 
        return "Goodbye! Feel free to come back if you have more questions!";
      
      // Weather
      if (text.includes("weather")) 
        return "I don't have access to real-time weather data, but I hope it's nice where you are!";
      
      // Time
      if (text.includes("time") && (text.includes("what") || text.includes("current"))) 
        return `I don't have access to your local time, but I'm always ready to chat!`;
      
      // Help
      if (text.includes("help") || text.includes("assist")) 
        return "I can answer questions, provide information, or just chat. What would you like to know?";
      
      // Jokes
      if (text.includes("joke") || text.includes("funny")) 
        return "Why don't scientists trust atoms? Because they make up everything!";
      
      // Thank you
      if (text.includes("thank") || text.includes("thanks")) 
        return "You're welcome! I'm happy to help.";
      
      // Default responses
      const defaultResponses = [
        "I'm not sure I understand. Could you rephrase that?",
        "That's interesting! Tell me more.",
        "I'm still learning, but I'll try my best to help.",
        "I don't have information about that yet, but I'm learning every day!",
        "Let's talk about something else. What are you interested in?"
      ];
      
      return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
    }
  </script>

</body>
</html>
